# Dependabot: gestion automatizada de dependencias (SCA + actualizaciones).
# - Revisa semanalmente las dependencias Python, imagenes Docker y Actions.
# - Abre un Pull Request por cada actualizacion (o grupo) con changelog y CVE.
# - Cada PR se valida con .github/workflows/dependency-check.yml y con el
#   pipeline de Jenkins (pytest + Bandit + pip-audit + ZAP) antes del merge.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      # parches y menores juntos (SemVer compatibles); mayores por separado
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/jenkins"
      - "/monitoring/prometheus"
      - "/monitoring/grafana"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(actions)"
