{% extends 'base.html' %}{% block content %}
<h2>Login del Sistema Académico</h2>
{% if error %}<p><b>{{ error }}</b></p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  Usuario: <input type="text" name="username" maxlength="64" autocomplete="username"><br>
  Password: <input type="password" name="password" maxlength="128" autocomplete="current-password"><br>
  <input type="submit" value="Ingresar">
</form>
{% endblock %}
